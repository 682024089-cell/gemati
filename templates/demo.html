{% extends 'base.html' %}

{% block title %}Gemanti - Demo{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/css/demo.css">
{% endblock %}

{% block content %}
    <section class="game-menu-page direct-view demo-top" role="main">
     
        <div class="demo-page">
          <h2>Demo</h2>
          <div class="demo-video-wrapper">
            <video controls playsinline preload="metadata" poster="/static/img/logo.png">
              <source src="/static/video/vidio_bantuan.mp4" type="video/mp4">
              Browser kamu tidak mendukung pemutar video.
            </video>
          </div>
          
          <div class="demo-actions">
            <a class="btn" href="/menu">Kembali</a>
          </div>
        </div>
<style>
  .bottom-right {
    position: fixed;
    right: 0.5rem;
    bottom: 0.5rem;
    width: clamp(48px, 10vw, 60px);
    aspect-ratio: 1;
    border: none;
    background: transparent;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 1000;
  }

  .bottom-right img {
    width: 30%;
    height: 30%;
    object-fit: contain;
  }
</style>

<!-- Tombol Fullscreen (Kanan Bawah) -->
<button id="fullscreenButton" class="bottom-right" type="button" aria-label="Buka layar penuh">
  <img src="/static/img/fs.png" alt="Layar penuh">
</button>

<style>
  .icon-button {
    position: absolute;
    top: 0.5rem;
    width: clamp(48px, 10vw, 60px);
    aspect-ratio: 1;
    border: none;
    background: transparent;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .top-left {
    left: 0.5rem;
  }

  .top-right {
    right: 0.5rem;
  }

  .icon-button img {
    width: 70%;
    height: 70%;
    object-fit: contain;
  }
</style>

<!-- Speaker (Kiri Atas) -->
<button class="icon-button top-left" id="soundButton" type="button" aria-label="Matikan suara">
  <img id="soundIcon" src="/static/img/speaker_aktif.png" alt="">
</button>

<!-- Home (Kanan Atas) -->
<button class="icon-button top-right" id="profileButton" type="button" aria-label="Profil">
  <img src="/static/img/home.png" alt="">
</button>
    </div>
    </section>
    <script>
      document.addEventListener('DOMContentLoaded', function(){
        const v = document.querySelector('video');
        if (v) {
          try { v.scrollIntoView({block: 'center', inline: 'center'}); } catch(e) {}
        }
      });
    </script>
{% endblock %}
