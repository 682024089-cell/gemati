{% extends 'base.html' %}

{% block title %}Gemanti - Demo{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/css/demo.css">
{% endblock %}

{% block content %}
  <section class="demo-page direct-view" aria-label="Demo">
    <div class="demo-panel">
      <div class="demo-content">
        <h1>Demo</h1>

        <div class="demo-video-wrapper">
          <video controls playsinline preload="metadata" poster="/static/img/logo.png">
            <source src="/video/vidio_bantuan.mp4" type="video/mp4">
            Browser kamu tidak mendukung pemutar video.
          </video>
        </div>
      </div>

      <a class="demo-control demo-control--back" href="/menu" id="backButton" aria-label="Kembali ke menu">
        <span>Kembali</span>
      </a>
      <style> 

  .demo-video-wrapper video {
    background: #ffffff;
  }

  .demo-control--back {
    position: absolute;
    left: 50%;
    bottom: 1rem;
    transform: translateX(-50%);
    min-width: 130px;
    width: 130px;
    height: 52px;
    padding: 0 1rem;
    border-radius: 999px;
    border: 1px solid rgba(149, 105, 58, 0.2);
    background: #fff;
    color: #4b2d10;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    flex-shrink: 0;
    box-sizing: border-box;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }

  .profil-panel {
    position: relative;
  }

  .icon-button {
    position: absolute;
    top: 0.5rem;
    width: clamp(48px, 10vw, 60px);
    aspect-ratio: 1;
    border: none;
    background: transparent;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
  }

  .top-left {
    left: 0.5rem;
  }

  .top-right {
    right: 0.5rem;
  }

  .icon-button img {
    width: 70%;
    height: 70%;
    object-fit: contain;
  }

  #fullscreenButton,
  .bottom-right {
    position: absolute;
    right: 0.75rem;
    bottom: 0.75rem;
    width: clamp(48px, 10vw, 60px);
    aspect-ratio: 1;
    border: none;
    background: transparent;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
  }

  #fullscreenButton img,
  .bottom-right img {
    width: 30%;
    height: 30%;
    object-fit: contain;
  }
</style>

<!-- Speaker (Kiri Atas) -->
<button class="icon-button top-left" id="soundButton" type="button" aria-label="Matikan suara">
  <img id="soundIcon" src="/static/img/speaker_aktif.png" alt="">
</button>

<!-- Home (Kanan Atas) -->
<button class="icon-button top-right" id="profileButton" type="button" aria-label="Profil">
  <img src="/static/img/home.png" alt="">
</button>

<!-- Tombol Fullscreen (Kanan Bawah dalam panel) -->
<button
  id="fullscreenButton"
  type="button"
  aria-label="Buka layar penuh"
  class="bottom-right"
>
  <img src="/static/img/fs.png" alt="Layar penuh">
</button>

    </div>
  </section>
{% endblock %}
