{% extends 'base.html' %}

{% block title %}Gemanti - Home{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/css/home.css">
{% endblock %}

{% block body_class %}page-home{% endblock %}

{% block content %}

  <div id="introVideoOverlay" class="intro-video-overlay" style="position: fixed; inset: 0; z-index: 999999; display: flex; background: #fff; cursor: pointer;">
    <div class="intro-video-panel" style="width: 100%; height: 100%; background: #fff; position: relative;">
      <video id="introVideo" playsinline preload="auto" style="width: 100%; height: 100%; object-fit: cover; display: block; background: #fff;" poster="/static/img/logo.png">
        <source src="/static/video/vidio_logo.mp4" type="video/mp4">
      </video>
      <img id="introFallbackImage" src="/static/img/logo.png" alt="Gemati" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; background: #fff;">
      <button id="introVideoStartButton" type="button" style="position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 0.8rem 1.5rem; border: none; border-radius: 999px; background: #ffffff; color: #2f1d0b; font-weight: 700; cursor: pointer; box-shadow: 0 8px 18px rgba(0,0,0,0.25);">Lanjut
      </button>
    </div>
  </div>

  <div class="menu-wrap" style="position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%); z-index: 999999; visibility: hidden; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;">
    <a class="menu-card" id="menuButton" href="/menu" aria-label="Mulai permainan">
      <img class="menu-image" src="/static/img/mulai.png" alt="Mulai">
    </a>
  </div>

  <div class="menu-wrap" style="position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%); z-index: 999999; visibility: hidden; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;">
    <a class="menu-card" id="menuButton" href="/menu" aria-label="Mulai permainan">
      <img class="menu-image" src="/static/img/mulai.png" alt="Mulai">
    </a>
  </div>

  <script>
    (function () {
      const overlay = document.getElementById('introVideoOverlay');
      const video = document.getElementById('introVideo');
      const startButton = document.getElementById('introVideoStartButton');
      const menuWrap = document.querySelector('.menu-wrap');
      const fallbackImage = document.getElementById('introFallbackImage');

      if (!overlay || !video) return;

      const showMenu = () => {
        if (menuWrap) {
          menuWrap.style.visibility = 'visible';
          menuWrap.style.opacity = '1';
          menuWrap.style.pointerEvents = 'auto';
        }
        if (fallbackImage) {
          fallbackImage.style.display = 'none';
        }
        overlay.style.display = 'none';
        overlay.style.visibility = 'hidden';
        overlay.setAttribute('aria-hidden', 'true');
      };

      const showFallback = () => {
        if (fallbackImage) {
          fallbackImage.style.display = 'block';
        }
        if (video) {
          video.style.display = 'none';
        }
        if (startButton) {
          startButton.style.display = 'inline-block';
        }
      };

      const hideMenu = () => {
        if (menuWrap) {
          menuWrap.style.visibility = 'hidden';
          menuWrap.style.opacity = '0';
          menuWrap.style.pointerEvents = 'none';
        }
      };

      hideMenu();
      overlay.style.display = 'flex';
      overlay.style.visibility = 'visible';
      overlay.setAttribute('aria-hidden', 'false');

      const startIntroVideo = () => {
        if (!startButton) return;

        startButton.disabled = true;
        startButton.style.display = 'none';

        try {
          video.load();
        } catch (error) {
          // ignore load issues and continue with play attempt
        }

        const tryPlay = () => {
          video.muted = true;
          video.volume = 1;

          video.play().then(() => {
            video.muted = false;
            video.volume = 1;
          }).catch(() => {
            if (fallbackImage) {
              fallbackImage.style.display = 'block';
            }
            if (video) {
              video.style.display = 'none';
            }
            startButton.textContent = 'Lanjut';
            startButton.disabled = false;
            startButton.style.display = 'inline-block';
          });
        };

        tryPlay();
      };

      const forceFallback = () => {
        showFallback();
      };

      if (startButton) {
        startButton.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopPropagation();
          startIntroVideo();
        });
      }

      overlay.addEventListener('click', function (event) {
        if (event.target === overlay || event.target === video) {
          startIntroVideo();
        }
      });

      video.addEventListener('ended', function () {
        showMenu();
      }, { once: true });

      video.addEventListener('error', function () {
        forceFallback();
      }, { once: true });

      video.addEventListener('stalled', function () {
        forceFallback();
      }, { once: true });

      setTimeout(() => {
        if (video.readyState < 2) {
          forceFallback();
        }
      }, 1800);
    })();
  </script>

{% endblock %}
